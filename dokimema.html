 const W=[['悪性新生物（がん）',b[0]*(S.dis.k?4:1)*(poor?1.2:1)],['心疾患',b[1]*(poor?1.3:1)],['脳血管疾患',b[2]*(S.dis.s?4:1)*(poor?1.3:1)],['肺炎',b[3]*.55*(poor?2:1)],['誤嚥性肺炎',b[3]*.45*(S.dem?2:1)*(poor?2:1)],['不慮の事故（'+['転倒・転落','入浴中の溺死','窒息','熱中症'][R()*4|0]+'）',b[4]*(poor?3:1)*(S.adl?1.5:1)],['老衰',b[5]*(S.care?2:1)*(poor?.4:1)],['腎不全',b[6]*(S.dis.d?2:1)],['認知症',b[7]*(S.dem?4:1)],['その他',b[8]]];
 let t=0;for(const x of W)t+=x[1];
 if(poor)W.push(['低栄養・衰弱',t*.07],['孤立死',t*.05],['生活困窮',t*.03]);if(!poor&&S.nu<30)W.push(['低栄養・衰弱',t*.1]);
 t=0;for(const x of W)t+=x[1];
 let r=R()*t;for(const x of W){r-=x[1];if(r<=0)return x[0]+'（'+a+'歳での死因確率 '+Math.round(x[1]/t*100)+'%）'}return '老衰'}

 if(poor)W.push(['低栄養・衰弱',7],['孤立死',5],['生活困窮',3]);

function tick(){

 for(const k in DIS)if(!S.dis[k]&&R()<DIS[k][1]/10/12*(a>74?1.5:1)*EF[sel].d[bnd(a)]){S.dis[k]=true;say(DIS[k][0]+'と診断された','bad')}

 else if(AE[sel]&&R()<.12){aEv()}else if(R()<.07){if(doEv(pickW(NW),'📰 '))return}else if(R()<.15){if(doEv(pickW(E),''))return}
 S.vit=Math.max(S.vamp?20:0,Math.min(100,S.vit));

 draw()}
