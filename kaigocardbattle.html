<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>介護カードバトル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: black table, white type. Deck builder is a card catalogue grid; battle is a vertical arena (enemy bench/active, log, own active/bench), then actions, detail and a scrolling hand. */
:root {
  --bg: #0a0a0a;
  --panel: #151515;
  --line: #3b3b3b;
  --fg: #f3f3f3;
  --dim: #9b9b9b;
  --hi: #ffffff;
  --font-display: 'DotGothic16', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --font-body: 'Noto Sans JP', -apple-system, 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.disp { font-family: var(--font-display); font-weight: 400; letter-spacing: .04em; }
.dim { color: var(--dim); }
.sm { font-size: 12px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 6vw, 40px); letter-spacing: .06em; line-height: 1.25; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 700; letter-spacing: .08em; }
a { color: var(--fg); text-underline-offset: 3px; }

.btn {
  font: inherit; font-weight: 500; color: var(--bg); background: var(--hi);
  border: 1px solid var(--hi); padding: 8px 16px; cursor: pointer; min-height: 40px;
}
.btn.ghost { color: var(--fg); background: transparent; border-color: var(--line); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.ghost:hover:not(:disabled) { border-color: var(--hi); }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }

.tag { display: inline-block; border: 1px solid var(--dim); padding: 0 6px; font-size: 11px; letter-spacing: .08em; line-height: 18px; white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row .grow { flex: 1; }

/* deck builder */
.head { display: flex; flex-direction: column; gap: 6px; padding-block: 8px 4px; }
.panel { border: 1px solid var(--line); background: var(--panel); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.chart { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 4px 16px; font-size: 13px; }
.chart div { display: flex; gap: 8px; align-items: center; min-width: 0; }
details summary { cursor: pointer; font-weight: 700; letter-spacing: .08em; }
details ul { margin: 8px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .spacer { flex: 1; min-width: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 4px 12px; cursor: pointer; min-height: 34px; }
.chip[aria-pressed="true"] { background: var(--hi); color: var(--bg); border-color: var(--hi); }
.count { font-family: var(--font-display); font-size: 20px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card {
  border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
  cursor: pointer; min-width: 0; position: relative;
}
.card:hover { border-color: var(--dim); }
.card.on { border-color: var(--hi); box-shadow: inset 0 0 0 1px var(--hi); }
.card .name { font-weight: 700; font-size: 15px; line-height: 1.35; }
.card .desc { font-size: 12px; color: var(--dim); }
.card .mv { border-top: 1px solid var(--line); padding-top: 4px; font-size: 12px; }
.card .mv b { font-weight: 500; font-size: 13px; margin-right: 6px; }
.card .check { position: absolute; right: 10px; top: 10px; font-size: 12px; }
.sources { font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 2px; }

/* battle */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .grow { flex: 1; }
.arena { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
.status b { font-size: 14px; }
.bench { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.active { width: 62%; margin: 0 auto; min-width: 150px; max-width: 100%; }
.tile {
  border: 1px solid var(--line); background: var(--panel); padding: 6px 8px; min-height: 84px; display: flex; flex-direction: column; gap: 3px;
  cursor: pointer; min-width: 0; overflow-wrap: anywhere;
}
.tile.big { min-height: 112px; border-color: var(--dim); }
.tile.sel, .htile.sel { border-color: var(--hi); box-shadow: inset 0 0 0 1px var(--hi); }
.tile.empty { border-style: dashed; align-items: center; justify-content: center; cursor: default; background: transparent; }
.tname { font-weight: 700; font-size: 13px; line-height: 1.3; }
.tile.big .tname { font-size: 15px; }
.st { font-size: 11px; border: 1px solid var(--dim); padding: 0 4px; line-height: 16px; }
.hp { height: 5px; background: #2a2a2a; margin-top: auto; }
.hp i { display: block; height: 100%; background: var(--hi); transition: width .3s; }
.hpn { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.log { border: 1px solid var(--line); padding: 6px 10px; font-size: 12px; color: var(--dim); min-height: 104px; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; }
.log .new { color: var(--fg); font-weight: 500; }
.banner { border: 1px solid var(--hi); padding: 8px 12px; text-align: center; font-weight: 500; }
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 640px; margin: 0 auto; }
.actions .btn { text-align: left; display: flex; flex-direction: column; gap: 0; line-height: 1.4; padding: 8px 12px; }
.actions .btn small { font-size: 11px; opacity: .75; }
.actions .wide { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .wide .btn { text-align: center; justify-content: center; }
.info { width: 100%; max-width: 640px; margin: 0 auto; border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 96px; }
.info .mv { border-top: 1px solid var(--line); padding-top: 4px; font-size: 12px; }
.info .mv b { font-size: 13px; font-weight: 500; margin-right: 6px; }
.handlabel { width: 100%; max-width: 640px; margin: 0 auto; font-size: 12px; }
.hand { width: 100%; max-width: 640px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
.htile { flex: 0 0 172px; border: 1px solid var(--line); background: var(--panel); padding: 8px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.htile.dim { opacity: .55; }
.htile .cost { font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.overlay {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .86); z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
.overlay .box { background: var(--panel); border: 1px solid var(--hi); padding: 24px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.cw-intr { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; margin-bottom: 4px; border: 1px solid #ff5a5a; border-radius: 10px; background: rgba(255, 60, 60, .12); animation: intrshake .5s ease-out both; }
.cw-intr b { color: #ff7a7a; font-size: 18px; letter-spacing: .12em; }
.cw-intr span { font-size: 14px; font-weight: 700; }
@keyframes intrshake { 0% { transform: translateX(-14px); opacity: 0; } 30% { transform: translateX(10px); opacity: 1; } 55% { transform: translateX(-6px); } 80% { transform: translateX(3px); } 100% { transform: none; } }
.overlay .box { max-height: calc(100vh - 32px); overflow-y: auto; }
.mvp { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mvp .bs-card.mvp-card { position: relative; left: auto; top: auto; flex: none; width: 152px; height: 200px; cursor: default; border-color: #ffd37a; box-shadow: 0 0 18px rgba(255, 211, 122, .45); background: linear-gradient(180deg, #2a2417, #14110a); animation: mvpin .6s cubic-bezier(.2, 1.3, .4, 1) both; }
.mvp .bs-card.mvp-card .ic { font-size: 58px; }
.mvp-t { font-size: 15px; font-weight: 700; letter-spacing: .06em; color: #ffd37a; }
.mvp-s { font-size: 11px; opacity: .8; letter-spacing: .04em; }
@keyframes mvpin { 0% { transform: scale(.4) rotate(-8deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
.overlay .box h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: .1em; }
.overlay .box .row { justify-content: center; }
/* card frame */
.card { border: 2px solid #6a6a6a; border-radius: 12px; background: linear-gradient(180deg, #1c1c1c, #0f0f0f); padding: 8px; gap: 8px; }
.card:hover { border-color: #b5b5b5; }
.card.on { border-color: #c9ecd5; background: linear-gradient(180deg, #1b2520, #111613); box-shadow: 0 0 0 1px #c9ecd5, 0 0 14px rgba(201, 236, 213, .18); }
.card.on:hover { border-color: #dcf5e4; }
.adopt { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }
.adopt .minus { font: inherit; font-size: 12px; font-weight: 700; padding: 0 10px; height: 24px; line-height: 1; color: #c9ecd5; background: transparent; border: 1px solid #c9ecd5; border-radius: 4px; cursor: pointer; }
.adopt .dots { font-style: normal; color: #000; font-size: 13px; letter-spacing: 2px; margin-left: 8px; white-space: nowrap; }
.count.full { color: #ffd37a; }
.warn { color: #ffd37a; }
/*adp*/ .adopt .adp { writing-mode: horizontal-tb; white-space: nowrap; background: #c9ecd5; color: #000; font-size: 13px; font-weight: 700; letter-spacing: .08em; padding: 1px 12px; border-radius: 4px; line-height: 20px; }
.chead { display: flex; align-items: stretch; gap: 8px; }
.chead.sp { justify-content: space-between; }
.cname { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.3; display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.costb, .hpb { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 48px; padding: 3px 7px; border-radius: 8px; line-height: 1; }
.costb { background: var(--hi); color: #000; }
.hpb { background: #000; color: var(--hi); border: 2px solid var(--hi); }
.costb small, .hpb small { font-size: 10px; font-weight: 700; letter-spacing: .06em; margin-bottom: 2px; }
.costb b, .hpb b { font-family: var(--font-display); font-weight: 400; font-size: 24px; white-space: nowrap; }
.hpb b i { font-style: normal; font-size: 12px; opacity: .7; }
.costb.s, .hpb.s { min-width: 38px; padding: 2px 5px; border-radius: 7px; }
.costb.s b, .hpb.s b { font-size: 18px; }
.art { position: relative; height: 92px; border: 1px solid var(--line); border-radius: 8px; background: radial-gradient(circle at 50% 40%, #303030, #0b0b0b); display: flex; align-items: center; justify-content: center; }
.art.s { height: 54px; }
.art .tag { position: absolute; left: 6px; top: 6px; background: #000; }
.art.s .tag { left: 4px; top: 4px; font-size: 10px; line-height: 16px; padding: 0 4px; }
.art .check { position: absolute; right: 6px; bottom: 6px; background: var(--hi); color: #000; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 3px; line-height: 18px; }
.htile { border-width: 2px; border-radius: 10px; background: linear-gradient(180deg, #1c1c1c, #0f0f0f); }
.tile { border-width: 2px; border-radius: 8px; }
.hpn b { font-size: 18px; color: var(--hi); font-weight: 700; }
.info .cname .ic { font-size: 28px; }
.foot { text-align: center; padding-top: 4px; }

/* battle mini cards */
.bench { display: flex; justify-content: center; gap: 8px; }
.active { width: auto; min-width: 0; display: flex; justify-content: center; margin: 0 auto; }
.mc { position: relative; width: var(--w, 92px); min-height: calc(var(--w, 92px) * 1.45); padding: 5px; gap: 3px; border: 2px solid #6a6a6a; border-radius: 9px; background: linear-gradient(180deg, #1c1c1c, #0f0f0f); display: flex; flex-direction: column; cursor: pointer; min-width: 0; flex: none; }
.tile.mc { --w: 92px; }
.tile.mc.big { --w: 120px; border-color: #b5b5b5; min-height: calc(var(--w) * 1.45); }
.htile.mc { --w: 88px; flex: 0 0 88px; }
.tile.mc.empty { align-items: center; justify-content: center; border-style: dashed; background: transparent; cursor: default; }
.mtop { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.cpb2 { display: inline-flex; align-items: baseline; gap: 2px; background: var(--hi); color: #000; border-radius: 6px; padding: 1px 6px; line-height: 1.1; }
.cpb2 small { font-size: 9px; font-weight: 700; }
.cpb2 b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.mc .tag { font-size: 10px; line-height: 15px; padding: 0 4px; }
.mart { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 6px; background: radial-gradient(circle at 50% 40%, #2e2e2e, #0c0c0c); }
.mart .sts { position: absolute; left: 2px; right: 2px; bottom: 2px; display: flex; gap: 2px; justify-content: center; flex-wrap: wrap; }
.mc .tname { font-size: 11px; line-height: 1.25; text-align: center; min-height: 2.5em; display: flex; align-items: center; justify-content: center; }
.tile.mc.big .tname { font-size: 13px; }
.mc .hp { margin-top: 0; }
.mc .hpn { text-align: center; font-size: 10px; }
.mc .hpn b { font-size: 15px; }
.tile.hit::before, .tile.ghost::before { content: ""; position: absolute; inset: 0; border-radius: 7px; background: rgba(255, 48, 48, .5); pointer-events: none; z-index: 2; animation: redflash .6s ease-out both; }
@keyframes redflash { 0% { opacity: 1; } 100% { opacity: 0; } }

/* drag & drop, hover detail */
.mc[draggable="true"] { cursor: grab; }
.drag-on .tile[data-drop] { outline: 2px dashed #c9ecd5; outline-offset: 2px; }
.tile.dropok { box-shadow: 0 0 0 3px #c9ecd5; }
.tip { position: fixed; z-index: 40; width: 270px; pointer-events: none; background: #121212; border: 1px solid var(--hi); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .65); font-family: var(--font-body); font-size: 14px; line-height: 1.5; color: var(--fg); }
.tip .cname .ic { font-size: 28px; }

/* navigation / gacha */
.nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nav .turn { margin-left: 8px; font-size: 13px; }
.navb { font: inherit; font-weight: 700; letter-spacing: .1em; padding: 8px 20px; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); cursor: pointer; }
.navb:hover { border-color: var(--hi); }
.navb[aria-current="page"] { background: var(--hi); color: #000; border-color: var(--hi); }
.btn.big { font-size: 18px; padding: 12px 28px; min-height: 54px; }
.scene { width: 100%; max-width: 720px; margin: 0 auto; border: 1px solid var(--line); border-radius: 14px; background: radial-gradient(circle at 50% 30%, #1d1d1d, #0a0a0a 70%); padding: 8px; overflow: hidden; }
.scene svg { display: block; width: 100%; height: auto; }
.gctl { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.gprog { width: min(420px, 100%); height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; }
.gprog i { display: block; height: 100%; background: var(--hi); width: 0; animation: gprog var(--dur, 5s) linear calc(0s - var(--el)) both; }
@keyframes gprog { from { width: 0; } to { width: 100%; } }
.win { fill: #262626; stroke: #f3f3f3; stroke-width: 2; }
.cap, .ring { opacity: 0; }
.cap, .pop, .ring, .crank, .door-l, .door-r { transform-box: fill-box; transform-origin: center; }
.go .bld { animation: bshake .22s linear calc(.2s - var(--el)) 10; }
.go .win { animation: winf .5s ease-in-out calc(var(--d) - var(--el)) 3; }
.go .crank { animation: crank 1.8s ease-in-out calc(.1s - var(--el)) both; }
.go .door-l { animation: dl 2.4s ease-in-out calc(2s - var(--el)) both; }
.go .door-r { animation: dr 2.4s ease-in-out calc(2s - var(--el)) both; }
.go .cap { animation: capdrop .8s cubic-bezier(.3, .1, .5, 1) calc(var(--d) - var(--el)) both; }
.go .pop { animation: cappop .5s ease-in calc(var(--pd) - var(--el)) both; }
.go .ring { animation: ringx .6s ease-out calc(var(--pd) - var(--el)) both; }
.flash { opacity: 0; pointer-events: none; }
.go .flash { animation: flashk .5s ease-in calc(4.5s - var(--el)) both; }
@keyframes bshake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-5px, 1px); } 50% { transform: translate(4px, -1px); } 75% { transform: translate(-3px, 0); } }
@keyframes winf { 0%, 100% { fill: #262626; } 50% { fill: #ffffff; } }
@keyframes crank { from { transform: rotate(0); } to { transform: rotate(720deg); } }
@keyframes dl { 0% { transform: translateX(0); } 12%, 80% { transform: translateX(-36px); } 100% { transform: translateX(0); } }
@keyframes dr { 0% { transform: translateX(0); } 12%, 80% { transform: translateX(36px); } 100% { transform: translateX(0); } }
@keyframes capdrop {
  0% { transform: translate(0, 0) scale(.5); opacity: 0; }
  15% { transform: translate(0, 10px) scale(1); opacity: 1; }
  55% { transform: translate(calc(var(--tx) * .7), 50px); opacity: 1; }
  72% { transform: translate(calc(var(--tx) * .92), 38px); opacity: 1; }
  88% { transform: translate(var(--tx), 52px); opacity: 1; }
  100% { transform: translate(var(--tx), 50px); opacity: 1; }
}
@keyframes cappop { 0% { transform: scale(1); opacity: 1; } 60% { transform: scale(1.7); opacity: 1; } 100% { transform: scale(2.3); opacity: 0; } }
@keyframes ringx { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; } 100% { opacity: 0; transform: scale(3.2); } }
@keyframes flashk { 0% { opacity: 0; } 60% { opacity: .85; } 100% { opacity: 0; } }
.gcards { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.gcol { display: flex; flex-direction: column; align-items: center; gap: 4px; animation: gin .45s ease-out both; }
.gc.mc { --w: 104px; cursor: default; overflow: visible; }
.gc .newb { position: absolute; top: -8px; right: -6px; z-index: 2; background: var(--hi); color: #000; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 4px; line-height: 18px; }
@keyframes gin { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .go .bld { animation: none; } }

/* deck builder v2 */
.cen-t { text-align: center; }
.cen-f { justify-content: center; }
.board { width: 100%; max-width: 660px; margin: 0 auto; border: 2px solid #6a6a6a; border-radius: 14px; padding: 12px; background: radial-gradient(circle at 50% 0, #1e1e1e, #0c0c0c); display: flex; flex-direction: column; gap: 10px; }
.board .bh { display: flex; flex-direction: column; gap: 2px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.dslot { position: relative; aspect-ratio: 5 / 7; border: 2px solid #6a6a6a; border-radius: 7px; background: linear-gradient(180deg, #212121, #101010); display: flex; align-items: center; justify-content: center; cursor: pointer; min-width: 0; user-select: none; }
.dslot .ic { font-size: 22px; }
.dslot .dcp { position: absolute; left: 2px; top: 2px; background: var(--hi); color: #000; font-size: 10px; font-weight: 700; line-height: 14px; padding: 0 4px; border-radius: 4px; }
.dslot .dhp { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 10px; font-weight: 700; }
.dslot.sel { border-color: #c9ecd5; box-shadow: 0 0 0 1px #c9ecd5; }
.dslot.empty { border-style: dashed; background: transparent; cursor: default; color: var(--dim); font-size: 11px; }

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function deckCost(ids) { return (ids || DECK).reduce((t, i) => t + CARDS[i].cost, 0); }
function saveDeck() { try { localStorage.setItem('kaigo-card-deck', JSON.stringify(DECK)); } catch (e) { /* ignore */ } }

function randomDeck(pool, size) {
  size = size || DECK_SIZE;
  const src = pool || CARDS.filter(x => !x.rare && !x.item).map(x => x.id);
  for (let k = 0; k < 200; k++) {
    const sh = shuffle(src), d = [], cnt = {};
    let cost = 0;
    for (const id of sh) {
      if (d.length >= size) break;
      if ((cnt[id] || 0) >= maxCopy(id) || cost + CARDS[id].cost > COST_MAX) continue;
      cnt[id] = (cnt[id] || 0) + 1; cost += CARDS[id].cost; d.push(id);
    }
    if (d.length === size) return d;
  }
  return src.slice().sort((a, b) => CARDS[a].cost - CARDS[b].cost).slice(0, size);
}
/* 相手（CPU）のデッキ：アイテムは全12種から、構成比7〜15%（同じカードは2枚まで） */
function cpuDeck() {
  const n = Math.max(1, Math.round(DECK_SIZE * (0.07 + Math.random() * 0.08)));
  const items = [], cnt = {};
  shuffle(CARDS.filter(x => x.item).map(x => x.id).concat(CARDS.filter(x => x.item).map(x => x.id))).forEach(id => {
    if (items.length < n && (cnt[id] || 0) < ITEM_COPY) { cnt[id] = (cnt[id] || 0) + 1; items.push(id); }
  });
  return randomDeck(null, DECK_SIZE - items.length).concat(items);
}

function pickItems(n) {
  const all = CARDS.filter(x => x.item).map(x => x.id), out = [], cnt = {};
  shuffle(all.concat(all)).forEach(id => { if (out.length < n && (cnt[id] || 0) < ITEM_COPY) { cnt[id] = (cnt[id] || 0) + 1; out.push(id); } });

}
/* 属性をなるべく均等に、ランダムに n 枚選ぶ（同じカードは maxCopy まで・CP合計は上限内） */
function pickBalanced(pool, n, cost0) {
  const out = [], cnt = {}, byAttr = {};
  let cost = cost0 || 0;
  pool.forEach(id => { (byAttr[CARDS[id].attr] = byAttr[CARDS[id].attr] || []).push(id); });
  const num = {};
  while (out.length < n) {
    const attrs = shuffle(Object.keys(byAttr)).filter(a => byAttr[a].some(id => (cnt[id] || 0) < maxCopy(id) && cost + CARDS[id].cost <= COST_MAX));
    if (!attrs.length) break;
    attrs.sort((x, y) => (num[x] || 0) - (num[y] || 0));
    const a = attrs[0];
    let c = shuffle(byAttr[a].filter(id => (cnt[id] || 0) < maxCopy(id) && cost + CARDS[id].cost <= COST_MAX));
    c.sort((x, y) => (cnt[x] || 0) - (cnt[y] || 0));
    const id = c[0];
    cnt[id] = (cnt[id] || 0) + 1; num[a] = (num[a] || 0) + 1; cost += CARDS[id].cost; out.push(id);
  }
  return { ids: out, cost };
}

  }

async function saveDeckFile(nm) {

  const data = deckFileText(cleanDeckName(nm)), name = deckFileName(nm);

function parseOppDeck(text, fname) {
  let v = null;
  try { v = JSON.parse(text); } catch (e) { v = null; }
  if (!v || !Array.isArray(v.deck)) return { err: 'デッキファイルを読み込めませんでした。[デッキ保存]で出力したファイルを選んでください。' };
  const byName = Object.create(null);
  CARDS.forEach(x => { byName[x.name] = x.id; });
  const ids = [];
  let bad = 0;
  v.deck.forEach(d => {
    const k = d ? +d.id : NaN;
    const id = (d && byName[d.name] !== undefined) ? byName[d.name] : (Number.isInteger(k) && CARDS[k] ? k : -1);

  if (deckCost(ids) > COST_MAX) return { err: 'CP合計が' + deckCost(ids) + 'で、上限' + COST_MAX + 'を超えています。' };
  const cnt = {};
  ids.forEach(i => { cnt[i] = (cnt[i] || 0) + 1; });
  const over = Object.keys(cnt).find(i => cnt[i] > maxCopy(+i));

    if (DECK.length !== DECK_SIZE) return;
    /* CPU対戦（「もう一度」を含む）は、そのたびに乱入の抽選をやり直す。デッキデータ対戦の再戦は同じ相手のまま */
    if (a === 'start' || (a === 'retry' && (!UI.opp || UI.opp.intruder))) UI.opp = rollIntruder();
    LBL.e = UI.opp && UI.opp.intruder ? UI.opp.name : '相手';
    newGame(DECK.slice(), UI.opp ? UI.opp.ids.slice() : null); UI.screen = 'battle'; UI.win = null; UI.sel = null;
    const heads = Math.random() < 0.5;
    G.first = heads ? 'p' : 'e';
    if (UI.opp && UI.opp.intruder) { sfx('intrude'); log('乱入！' + UI.opp.icon + UI.opp.name + 'が現れた！'); }
    log('対戦開始！' + (UI.opp && !UI.opp.intruder ? '相手は「' + UI.opp.name + '」のデッキ。' : '') + '先に' + WIN_PTS + '体を戦闘不能にしよう。');
    G.busy = true; UI.coin = { heads, t0: Date.now() };
    render(); if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
    runCoin(UI.coin); return;
  }
  if (a === 'coinskip') { if (UI.coin && Date.now() - UI.coin.t0 > 2400) UI.coin.skip = true; return; }
  if (a === 'toDeck') { if (G && G.over) G.dismissed = true; UI.screen = 'deck'; render(); return; }
  if (!G || G.over) return;
  if (a === 'closewin') { if (!G.mustPromote) { UI.win = null; render(); } return; }
  if (a === 'win') {
    if (G.mustPromote) return;
    UI.win = UI.win === d.v ? null : d.v; UI.fresh = true;
    if (UI.win === 'hand') UI.tgi = null;
    if (UI.win === 'hand' && !(UI.sel && UI.sel.zone === 'hand' && G.p.hand[UI.sel.idx])) UI.sel = G.p.hand.length ? { zone: 'hand', idx: 0 } : null;
    render(); return;
  }
  if (a === 'info') { UI.sel = { zone: d.zone, idx: +d.idx }; UI.win = 'info'; UI.fresh = true; render(); return; }
  if (G.busy && !(G.mustPromote && a === 'pick')) return;
  if (a === 'pick') {
    const z = d.zone, i = +d.idx;
    if (G.mustPromote && z === 'pb' && G.p.bench[i]) {
      const S = G.p; S.active = S.bench[i]; S.bench[i] = null; G.mustPromote = false;
      log('あなたは' + S.active.name + 'を前衛に出した。');
      UI.sel = null; UI.win = null;
      const r = G.pr; G.pr = null;
      render(); if (r) r(); return;
    }
    UI.sel = { zone: z, idx: i }; render(); return;
  }
  if (G.turn !== 'p' || G.mustPromote) return;
  if (a === 'swapopen') { UI.sel = { zone: 'pb', idx: +d.idx }; UI.win = 'swap'; UI.fresh = true; render(); return; }
  if (a === 'swapto') { swap('p', +d.idx); UI.sel = null; UI.win = null; render(); return; }
  if (a === 'useitem' && UI.sel && UI.sel.zone === 'hand') {
    const x = G.p.hand[UI.sel.idx];
    if (!x || !x.item || itemBlock('p', x)) return;
    if (itemTargets('p', x)) { UI.tgi = UI.sel.idx; UI.win = 'target'; UI.fresh = true; render(); return; }
    doItem(UI.sel.idx, null); return;
  }
  if (a === 'tgtpick') { if (UI.tgi === null || UI.tgi === undefined) return; doItem(UI.tgi, { s: d.s, z: d.z, i: +d.i }); return; }
  if (a === 'summon' && UI.sel && UI.sel.zone === 'hand') { summon('p', UI.sel.idx); UI.sel = null; UI.win = null; after(); render(); return; }
  if (a === 'swap' && UI.sel && UI.sel.zone === 'pb') { swap('p', UI.sel.idx); UI.sel = null; render(); return; }
  if (a === 'move') { UI.sel = null; UI.win = null; G.busy = true; animMove('p', +d.i).then(() => { G.busy = false; render(); }); return; }
  if (a === 'end') { endTurn('p'); UI.sel = null; UI.win = null; enemyTurn(); return; }
}

let tipEl = null, dragging = false;
function hideTip() { if (tipEl) tipEl.style.display = 'none'; }
function placeTip(ev) {
  const w = 270, vw = window.innerWidth, vh = window.innerHeight;
  let x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + w > vw - 8) x = ev.clientX - w - 16;
  if (x < 8) x = 8;
  const h = tipEl.offsetHeight;
  if (y + h > vh - 8) y = Math.max(8, vh - h - 8);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function showTip(x, ev) { tipEl.innerHTML = detailHTML(x); tipEl.style.display = 'flex'; placeTip(ev); }
function canHover() { try { return window.matchMedia('(hover: hover)').matches; } catch (e) { return false; } }
function doDrop(kind, idx, target) {
  if (!G || G.over || G.busy || G.turn !== 'p' || G.mustPromote) return;
  const z = target.split(':')[0], i = +target.split(':')[1];
  const P = G.p;
  if (kind === 'hand') {
    const c = P.hand[idx];
    if (!c) return;
    if (P.active && !P.bench.includes(null)) log('場がいっぱいです。');
    else if (P.cp < c.cost) log('CPが足りません（' + c.name + 'はCP' + c.cost + '）。');
    else { summon('p', idx, z === 'pb' ? i : undefined); after(); }
  } else if (kind === 'pb' && z === 'pa') {
    if (G.swapped) log('交代は1ターンに1回です。');
    else if (P.active && P.cp < 1) log('CPが足りません（交代はCP1）。');
    else swap('p', idx);
  } else return;
  UI.sel = null; UI.win = null; render();
}
function init() {
  sndLoad();
  if (typeof document !== 'undefined') {
    const unlock = () => {
      const c = sndCtx();
      if (!c) return;
      const hint = UI.screen === 'title' && c.state !== 'running';
      const done = () => { syncBGM(); if (hint && UI.screen === 'title') render(); };
      if (c.state === 'suspended') { try { c.resume().then(done, done); } catch (e) { /* ignore */ } } else syncBGM();
    };
    sndCtx();
    ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, true));
    document.addEventListener('visibilitychange', syncBGM);
  }
  loadRec();
  loadOwn();
  DECK = loadDeck();
  const app = document.getElementById('app');
  if (app && app.addEventListener) {
    app.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (t) { if (!NOTAP.has(t.dataset.act)) sfx('tap'); act(t.dataset.act, t.dataset); }
    });
    if (typeof document.createElement === 'function' && document.body) {
      tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.style.display = 'none';
      document.body.appendChild(tipEl);
    }
    app.addEventListener('mouseover', e => {
      if (!tipEl || !G || UI.screen !== 'battle' || UI.win || G.mustPromote || dragging || !canHover()) return;
      const t = e.target.closest('[data-zone]');
      const x = t ? cardAt(t.dataset.zone, +t.dataset.idx) : null;
      if (x) showTip(x, e); else hideTip();
    });
    app.addEventListener('mousemove', e => { if (tipEl && tipEl.style.display !== 'none') placeTip(e); });
    app.addEventListener('mouseleave', hideTip);
    app.addEventListener('dragstart', e => {
      const t = e.target.closest ? e.target.closest('[draggable="true"]') : null;
      if (!t) return;
      if (UI.screen === 'deck') {
        const dk = t.dataset.dk;
        if (dk === 'coll') UI.drag = { kind: 'coll', id: +t.dataset.id };
        else if (dk === 'deck') UI.drag = { kind: 'deck', idx: +t.dataset.idx };
        else return;
        dragging = true;
        e.dataTransfer.setData('text/plain', 'deck');
        e.dataTransfer.effectAllowed = 'move';
        app.classList.add('drag-on');
        return;
      }
      if (!G) return;
      const z = t.dataset.zone;
      if (!(G.turn === 'p' && !G.busy && !G.over && !G.mustPromote && (z === 'hand' || z === 'pb'))) { e.preventDefault(); return; }
      dragging = true; hideTip();
      e.dataTransfer.setData('text/plain', z + ':' + t.dataset.idx);
      e.dataTransfer.effectAllowed = 'move';
      app.classList.add('drag-on');
      setTimeout(() => { if (dragging) app.classList.add('bs-dragging'); }, 0);
    });
    const endDrag = () => {
      dragging = false; UI.drag = null; app.classList.remove('drag-on', 'bs-dragging');
      app.querySelectorAll('.dropok').forEach(el => el.classList.remove('dropok'));
    };
    app.addEventListener('dragend', endDrag);
    app.addEventListener('dragover', e => {
      if (UI.screen === 'deck') {
        const z = e.target.closest ? e.target.closest('[data-dz]') : null, d = UI.drag;
        if (!z || !d) return;
        if (!((z.dataset.dz === 'board' && d.kind === 'coll') || (z.dataset.dz === 'trash' && d.kind === 'deck'))) return;
        e.preventDefault(); e.dataTransfer.dropEffect = 'move';
        app.querySelectorAll('.dropok').forEach(el => { if (el !== z) el.classList.remove('dropok'); });
        z.classList.add('dropok');
        return;
      }
      const t = e.target.closest ? e.target.closest('[data-drop]') : null;
      if (!t) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      app.querySelectorAll('.dropok').forEach(el => { if (el !== t) el.classList.remove('dropok'); });
      t.classList.add('dropok');
    });
    app.addEventListener('drop', e => {
      if (UI.screen === 'deck') {
        const z = e.target.closest ? e.target.closest('[data-dz]') : null, d = UI.drag;
        endDrag();
        if (!z || !d) return;
        e.preventDefault();
        if (z.dataset.dz === 'board' && d.kind === 'coll') addToDeck(d.id);
        else if (z.dataset.dz === 'trash' && d.kind === 'deck') removeFromDeck(d.idx);
        return;
      }
      const t = e.target.closest ? e.target.closest('[data-drop]') : null;
      if (!t) return;
      e.preventDefault();
      const v = (e.dataTransfer.getData('text/plain') || '').split(':');
      endDrag();
      doDrop(v[0], +v[1], t.dataset.drop);
    });
    app.addEventListener('dblclick', e => {
      clearTimeout(UI.cfTimer);
      if (UI.screen !== 'deck') return;
      const t = e.target.closest ? e.target.closest('[data-dk]') : null;
      if (!t) return;
      if (t.dataset.dk === 'coll') addToDeck(+t.dataset.id);
    });
    app.addEventListener('scroll', e => { const car = e.target; if (car && car.id === 'car') UI.carX = car.scrollLeft; }, true);
    app.addEventListener('change', e => {
      const f = e.target;
      if (f && f.id === 'ofile' && f.files && f.files[0]) { const of = f.files[0]; f.value = ''; loadOppFile(of); return; }
      if (!f || f.id !== 'dfile' || !f.files || !f.files[0]) return;
      const file = f.files[0];
      if (file.size > 200000) { say('ファイルが大きすぎます。デッキファイルを選んでください。'); render(); return; }
      const r = new FileReader();
      r.onload = () => restoreFromText(String(r.result));
      r.onerror = () => { say('ファイルを読み込めませんでした。'); render(); };
      r.readAsText(file);
      f.value = '';
    });
    app.addEventListener('toggle', e => {
      const k = e.target && e.target.dataset ? e.target.dataset.k : null;
      if (k) UI.open[k] = e.target.open;
    }, true);
    app.addEventListener('keydown', e => {
      if (e.key === 'Escape' && UI.help) { UI.help = null; render(); return; }
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const t = e.target.closest('[data-act]');
      if (t && t.getAttribute('role') === 'button') { e.preventDefault(); act(t.dataset.act, t.dataset); }
    });
  }
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', applyScale);
  if (typeof document !== 'undefined') document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && UI.modeDlg) { UI.modeDlg = false; UI.modeMsg = ''; render(); return; }
    if (e.key === 'Escape' && UI.saveDlg) { UI.saveDlg = false; render(); return; }
    if (e.key === 'Enter' && UI.saveDlg && e.target && e.target.id === 'dname') { act('savego', {}); return; }
    if (e.key === 'Escape' && UI.help) { UI.help = null; render(); }
  });
  render();
}
init();
</script>
