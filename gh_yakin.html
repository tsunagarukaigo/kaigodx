 if(t==="med"&&!S.mod[i]){const r=Math.random();if(r<.18){S.mod[i]=1;say(`✨ ${nm}様、薬が効いて落ち着いた`)}else if(r<.25){S.mod[i]=2;say(`🌀 ${nm}様が服薬後にせん妄状態に…`)}}
 if(t==="listen"){S.st=Math.max(0,S.st-3);const o=S.mood[i];o.a=Math.max(0,o.a-6);o.u=Math.max(0,o.u-6)}
 else if(t==="gohome"){S.st=Math.max(0,S.st-.3);say(`${nm}様「家に帰る」…お話を聞いて落ち着かれた`)}
 else if(t==="viol")say(`${nm}様が落ち着いてくれた`);
 else if(t==="escape")say(`${nm}様を玄関で保護、危なかった…`);else if(t==="delus")say(`${nm}様と一緒に探して見つかった`);
 else if(t==="patrol"){S.pm[i]=0;S.st=Math.max(0,S.st-.3);if(Math.random()<.05)say(`👀 ${nm}様の体位を整え、早期に発赤に気づけた`)}
 else if(t==="fall"){S.st=Math.max(0,S.st-.3);if(Math.random()<.4)say(`${nm}様の立ち上がりを支え、転倒を防いだ`)}
 else S.st=Math.max(0,S.st-.3);if(t==="viol"&&Math.random()<.5){S.st+=20;say(`💔 ${nm}様の暴言・暴力で大きな精神ダメージ…`)}}
function tick(){if(S.over)return;
 S.m+=1;const m=S.m,dt=.1;
 S.sched.forEach(s=>{if(!s.d&&s.t<=m&&give(s.i,s.type))s.d=1});
 const hr=hrOf(m),p=(m>=360&&m<840?.04:.022*(m<240?1.15:1))*(1+.4*(carry.stage-1))*(m>=420&&m<600?1-S.nr:1)*(HF[hr]||1);
 if(Math.random()<p){const ri=pickRes(),ty=ri<0?null:pick(ri);if(!ty){}else if(ty==="odd"){if(give(ri,"odd")){const c=ri%3;[ri-3,ri+3,c>0?ri-1:-1,c<2?ri+1:-1].filter(j=>j>=0&&j<18).forEach(j=>{if(Math.random()<ACT[S.bd[j]])give(j,"nurse")})}}else if(ty!=="intrude")give(ri,ty);else if(!S.ev[ri]){const fr=[...Array(18).keys()].filter(j=>j!==ri&&!S.ev[j]);if(fr.length){give(ri,"intrude");give(fr[Math.floor(Math.random()*fr.length)],"victim")}}}
 {const pp=(m>=360&&m<840?.0034:.0026)*(PH[hr]||1)*.2;/* 巡回の発生頻度：従来比80%減 */for(let i=0;i<18;i++)if(S.bd[i]>=4&&Math.random()<pp)give(i,"patrol")}
 let act=0;
 for(let i=0;i<18;i++){const e=S.ev[i];if(!e)continue;act++;if(!e.doing){e.left-=dt;if(e.left<=0)fail(i);else{const r=e.left/T[e.type].dl;if(r<.5)bump(i,e.type,r<.4?.25:.1)}}}
 S.st+=.006*act;if(act>=4)S.st+=.1;/* サイン4つ以上の同時発生：ストレス+1/秒(1tick=0.1秒) */if(S.rest&&!S.busy){S.st=Math.max(0,S.st-.02);S.restMin++}if(m%60===0){if(!S.rh)S.st+=1;S.rh=0}
 if(S.busy){S.busy.left-=dt;if(S.busy.left<=0){const i=S.busy.i,t=S.ev[i].type;{const r=S.rec[t]||(S.rec[t]={n:0,min:0,miss:0});r.n++;r.min+=S.busy.tot*10}S.ev[i]=null;S.busy=null;okMsg(i,t)}}
 if(S.inc>=7)return end("lose","事故が重なり、施設は大きな問題に…");
 if(S.st>=100)return end("lose","心身が限界。夜勤者が倒れてしまった…");
 if(m>=END)return end("win");
 draw()}
function draw(){const m=S.m,h=(16+Math.floor(m/60))%24,mm=String(m%60).padStart(2,"0");
 $("clock").textContent=String(h).padStart(2,"0")+":"+mm;
 $("pg").firstChild.style.width=m/END*100+"%";$("stg").textContent="第"+carry.stage+"夜勤の進行";
 $("st").firstChild.style.width=Math.min(100,S.st)+"%";
 const BC=["#2e9d5c","#2f9fa0","#2f6fd0","#7fa070","#d9c12e","#e68a2e","#d33a3a"];$("inc").style.background=BC[Math.min(6,S.inc)];$("inc").innerHTML="🏢<small>運営状況</small>";
 rb.classList.toggle("dis",!!S.busy);
 const w=$("work");
 if(S.busy){const e=S.ev[S.busy.i];w.innerHTML=`${T[e.type].i} ${T[e.type].n.replace("!","")}対応中…<div class="bar"><i style="width:${(1-S.busy.left/S.busy.tot)*100}%"></i></div>`}
 else w.textContent=S.rest?"☕️ 休憩中…（回復はごくわずか）":"待機中（サインの出た利用者をタップ）";
 document.querySelectorAll(".c").forEach((c,i)=>{const e=S.ev[i],r=e?e.left/T[e.type].dl:0;
  c.className="c"+(e?(e.doing?" doing":(r<.4?" hot":" on")):"");
  c.querySelector(".e").textContent=e?T[e.type].i+T[e.type].n:"";const bd=c.querySelector(".bd");bd.textContent=["","✨","🌀"][S.mod[i]];bd.className="bd b"+S.mod[i];
  c.querySelector(".bar i").style.width=e&&!e.doing?r*100+"%":"0"})}
function end(r,msg){S.over=true;clearInterval(timer);draw();
 let t,b;const pay=r==="win"?20000:Math.floor(20000/17*(S.m/60));carry.total+=pay;const tot=`<br>累計報酬：<b>${carry.total.toLocaleString()}円</b>`;const ps=`<br>💴 報酬：<b>${pay.toLocaleString()}円</b>`;
 if(r==="win"){const g=S.inc===0&&S.st<50?"S":S.inc<=1&&S.st<70?"A":S.inc<=3?"B":"C";
  t=`🌅 第${carry.stage}夜勤 明け！`;const rd=.15+Math.random()*.15;carry.st=S.st*(1-rd);carry.inc=S.inc;(carry.ranks=carry.ranks||[]).push(g);carry.stage++;carry.ratio=Math.min(1,carry.ratio+.05+Math.random()*.05);b=`評価：<b style="font-size:28px">${g}</b><br>対応完了 ${S.done}件／見逃し ${S.miss}件<br>事故 ${S.inc}件／ストレス ${Math.floor(S.st)}%<br>🛌 明けの休息で疲労ストレスが${Math.round(rd*100)}%軽減（次の夜勤は${Math.floor(carry.st)}%から）${ps}${tot}`}
 else{t="💀 第"+carry.stage+"夜勤でゲームオーバー";b=`${msg}<br>（${$("clock").textContent} 時点／対応 ${S.done}件）<br>勤務 ${(S.m/60).toFixed(1)}時間${ps}${tot}<br>ランク平均：<b>${avgRank()}</b>`}
 const o=$("ov");o.className="ov";
 const card=`<div><h2>${t}</h2>${b}<button id="jn" class="sub">📋 勤務日誌</button>${r==="win"?"":'<button id="tw" class="x">𝕏 にツイートする</button>'}<button id="rt">${r==="win"?"第"+carry.stage+"夜勤へ":"最初から"}</button></div>`;
 const wire=()=>{$("rt").onclick=()=>{if(r!=="win")carry={stage:1,st:0,total:0};start()};const tw=$("tw");if(tw)tw.onclick=()=>{const tx=`【グループホーム夜勤ワンオペ物語 〜認知症利用者18名をおひとりで〜】\n第${S.no}夜勤でゲームオーバー💀\n累計報酬：${carry.total.toLocaleString()}円／ランク平均：${avgRank()}\nhttps://tsunagarukaigo.github.io/kaigodx/gh_yakin.html`;window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(tx),"_blank","noopener")};const j=$("jn");if(j)j.onclick=()=>{o.innerHTML=journal();$("jb").onclick=()=>{o.innerHTML=card;wire()}}};
 o.innerHTML=card;o.classList.remove("hide");wire()}
/* 勤務日誌：項目ごとの対応時間・休息時間の一覧表(ゲーム内の分)と、別枠の事故報告 */
/* ランク平均：S=4 A=3 B=2 C=1 の平均を最も近い評価に丸めて表示。クリア実績なしは「-」 */
function avgRank(){const a=carry.ranks||[];if(!a.length)return"-（クリアなし）";const P={S:4,A:3,B:2,C:1},v=a.reduce((x,g)=>x+P[g],0)/a.length,L=["C","B","A","S"][Math.min(3,Math.max(0,Math.round(v)-1))];return L+"（"+v.toFixed(1)+"/4.0）"}
function journal(){const fm=x=>x>=60?Math.floor(x/60)+"時間"+Math.round(x%60)+"分":Math.round(x)+"分";
 const ks=Object.keys(T).filter(k=>S.rec[k]&&(S.rec[k].n||S.rec[k].miss));let sn=0,sm=0,sx=0;
 const rows=ks.map(k=>{const r=S.rec[k];sn+=r.n;sm+=r.min;sx+=r.miss;return`<tr><td>${T[k].i}${T[k].n.replace("!","")}</td><td>${r.n}</td><td>${fm(r.min)}</td><td>${r.n?(r.min/r.n).toFixed(1)+"分":"-"}</td><td>${r.miss}</td></tr>`}).join("");
 const idle=Math.max(0,S.m-sm-S.restMin);
 const ac=S.acclog.length?S.acclog.map(x=>`・${clk(x.m)}　${x.who}様：${x.what}`).join("<br>"):"この夜勤の事故報告はありません。";
 return`<div class="jw"><h3>📋 勤務日誌（第${S.no}夜勤）</h3><table class="jt"><tr><th>項目</th><th>対応</th><th>対応時間</th><th>平均</th><th>見逃し</th></tr>${rows}<tr class="tt"><td>対応 合計</td><td>${sn}</td><td>${fm(sm)}</td><td>${sn?(sm/sn).toFixed(1)+"分":"-"}</td><td>${sx}</td></tr><tr><td>☕ 休息</td><td></td><td>${fm(S.restMin)}</td><td></td><td></td></tr><tr><td>🏃移動・見守り・その他</td><td></td><td>${fm(idle)}</td><td></td><td></td></tr></table>
<section class="jbox ac"><h5>🚨 事故報告</h5>${ac}</section><button id="jb">もどる</button></div>`}
function start(){$("ov").classList.add("hide");init();draw();clearInterval(timer);timer=setInterval(tick,100)}
const rb=$("rest");const rs=v=>{if(S){S.rest=v;if(v)S.rh=1}rb.textContent=v?"☕️ 休憩中…":"☕️ 休憩（押している間）"};
rb.onpointerdown=e=>{e.preventDefault();if(S&&S.busy)return;rs(true)};
["onpointerup","onpointerleave","onpointercancel"].forEach(k=>rb[k]=()=>rs(false));
rb.oncontextmenu=e=>e.preventDefault();
(function(){const c=$("cv"),x=c.getContext("2d"),W=c.width,H=c.height,G=H-6;
const E=Array.from({length:18},(_,i)=>({x:Math.random()*W,v:(.15+Math.random()*.2)*(i%2?1:-1),row:i%2,cane:i%3===0,ph:Math.random()*8}));
const R=(a,b,w,h)=>x.fillRect(Math.round(a),Math.round(b),w,h);
let t=0;
function fac(){const G=H-26;x.fillStyle="#111";
 R(40,G-40,88,1);R(40,G-40,1,41);R(127,G-40,1,41);R(40,G,88,1);
 R(34,G-44,100,4);R(46,G-48,76,4);
 [46,59,72,85,98,111].forEach(a=>R(a,G-35,8,7));
 [46,59,100,113].forEach(a=>R(a,G-22,8,7));
 R(78,G-15,11,15);
 x.fillStyle="#fff";
 [46,59,72,85,98,111].forEach(a=>R(a+1,G-34,6,5));
 [46,59,100,113].forEach(a=>R(a+1,G-21,6,5));
 x.fillStyle="#111";R(34,G+1,100,1);R(0,H-5,W,1)}
function man(e){const b=G-e.row*6,d=e.v>0?1:-1,px=Math.round(e.x),s=Math.floor(t/7+e.ph)%2;x.fillStyle="#111";
 R(px+d,b-12,3,3);R(px,b-9,3,5);
 if(s){R(px,b-4,1,4);R(px+2,b-4,1,3)}else{R(px,b-4,1,3);R(px+2,b-4,1,4)}
 if(e.cane)R(px+(d>0?4:-2),b-6,1,6)}
const step=()=>{const o=$("ov");if(!/\bop\b/.test(o.className)||/hide/.test(o.className)){clearInterval(id);return}
 t++;x.fillStyle="#fff";x.fillRect(0,0,W,H);fac();
 E.forEach(e=>{e.x+=e.v;if(e.x>W+5)e.x=-5;if(e.x<-5)e.x=W+5});
 E.filter(e=>e.row).forEach(man);E.filter(e=>!e.row).forEach(man)};
const id=setInterval(step,70);step()})();
